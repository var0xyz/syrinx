syntax = "proto3";

package syrinx;

import "common.proto";
import "identity.proto";
import "reed.proto";
import "admin.proto";

option go_package = "github.com/var0xyz/syrinx/proto";

// A single-use challenge nonce, for account recovery and identity claims.
message ChallengeResponse {
  string challenge = 1;
}

// POST /account-recovery/bootstrap.
message AccountRecoveryBootstrapRequest {
  string challenge = 1;
  string user_id = 2 [json_name = "userID"];
  string key_id = 3 [json_name = "keyID"];
  string signature = 4;
}

message AccountRecoveryBootstrapResponse {
  User profile = 1;
  repeated string following = 2;
  optional string tip_reed_id = 3 [json_name = "tipReedID"];
  repeated string reed_ids = 4 [json_name = "reedIDs"];
}

// A countersigned identity record as recovery's claim, peer and status
// flows carry it: User plus the active key and whether reeds exist.
message RecoveryProfile {
  string id = 1;
  string username = 2;
  string role = 3;
  uint32 member_since = 4;
  string bio = 5;
  string active_key_fingerprint = 6;
  UserSignature user_signature = 7;
  ServerSignature server_signature = 8;
  bool has_reeds = 9;
  UserInvite invite = 10;
  repeated string permissions = 11;
}

// POST /users/status: complete (200), ongoing (409), or unclaimed or
// unknown (404), both of which mean: run recovery.
message UserStatusResponse {
  string status = 1;
}

message RecoveryRevocation {
  string fingerprint = 1;
  string user_id = 2 [json_name = "userID"];
  string reason = 3;
  optional string successor = 4;
  UserSignature user_signature = 5;
  ServerSignature server_signature = 6;
}

// One level of the nested key chain. The outermost node is the active
// key; predecessor walks back to the signup key. signature is set only on
// predecessor links: the older key's signature over the newer key's armor.
message RecoveryKeyNode {
  string fingerprint = 1;
  string user_id = 2 [json_name = "userID"];
  string armor = 3;
  uint32 created_at = 4;
  uint32 expires_at = 5;
  bool revoked = 6;
  ServerSignature server_signature = 7;
  string signature = 8;
  RecoveryRevocation revocation = 9;
  RecoveryKeyNode predecessor = 10;
}

// POST /recovery/identity/claim.
message ClaimIdentityRequest {
  string challenge = 1;
  string signature = 2;
  RecoveryProfile profile = 3;
  RecoveryKeyNode key = 4;
}

// POST /recovery/identity.
message PeerIdentityRequest {
  RecoveryProfile profile = 1;
  RecoveryKeyNode key = 2;
}

// POST /recovery/reeds. The links are the ones the author signed, which
// the server can't check without the content, as when the reed was posted.
message RecoveryReedRequest {
  string reed_id = 1 [json_name = "reedID"];
  UserSignature user_signature = 2;
  ServerSignature server_signature = 3;
  string replying_to = 4;
  string replying_root = 5;
  string echoing = 6;
  string thread_head = 7;
  uint32 thread_index = 8;
  repeated string mentions = 9;
}

// One signed record a device holds, reported back to a rebuilt server.
message RecoveryRecord {
  oneof record {
    LikeCert like = 1;
    BlockCert block = 2;
    Vouch vouch = 3;
    ReedRemovalCert reed_removal = 4;
    AccountRemovalCert account_removal = 5;
    ThreadRecord thread = 6;
    ThreadRemoval thread_removal = 7;
    LedgerEntry ledger_entry = 8;
    AdminRequest admin_request = 9;
    ReedFlag flag = 10;
  }
}

// POST /recovery/records.
message RecoveryRecordsRequest {
  repeated RecoveryRecord records = 1;
}

// One outcome per record, in request order: stored (or already held),
// pending until what it refers to is restored, or refused with a reason.
message RecoveryRecordResult {
  string status = 1;
  string reason = 2;
}

message RecoveryRecordsResponse {
  repeated RecoveryRecordResult results = 1;
}

// POST /recovery/pins: the caller's pinned reeds, most recent first.
message RecoveryPinsRequest {
  repeated string reed_ids = 1 [json_name = "reedIDs"];
}

// POST /recovery/following.
message RecoveryFollowingRequest {
  repeated string user_ids = 1 [json_name = "userIDs"];
}
