syntax = "proto3";

package syrinx.websocket;

option go_package = "github.com/alvaro/syrinx/proto";

// WebSocket message wrapper
message WSMessage {
  MessageType type = 1;
  // Human-readable mirror of type (e.g. "DATA_RESPONSE"), redundant with
  // the enum — lets a raw frame be read without cross-referencing this
  // schema (protobuf enums are wire-encoded as bare varints, not names).
  string type_name = 12;
  // Event id this message replies to or originates (relay event id for
  // DATA_RESPONSE; echoed back by the client on DATA_ACK/DATA_INVALID).
  // Empty for message types that carry no event id.
  string id = 11;
  oneof payload {
    PingMessage ping = 2;
    PongMessage pong = 3;
    SubscribeMessage subscribe = 4;
    SubscribedMessage subscribed = 5;
    ReedNotificationMessage reed_notification = 6;
    UserUpdateMessage user_update = 7;
    ErrorMessage error = 8;
    RequestReedMessage request_reed = 9;
    DataResponseMessage data_response = 10;
  }
}

// Message types
enum MessageType {
  UNKNOWN = 0;
  PING = 1;
  PONG = 2;
  SUBSCRIBE = 3;
  SUBSCRIBED = 4;
  REED_NOTIFICATION = 5;
  USER_UPDATE = 6;
  ERROR = 7;
  SUBSCRIBE_USER = 8;
  SUBSCRIBE_BROADCAST = 9;
  UNSUBSCRIBE_USER = 10;
  UNSUBSCRIBE_BROADCAST = 11;
  REQUEST_REED = 12;
  DATA_RESPONSE = 13;
}

// Ping message
message PingMessage {
  string data = 1;
}

// Pong message
message PongMessage {
  string data = 1;
}

// Subscribe message
message SubscribeMessage {
  string data = 1;
}

// Subscribed confirmation
message SubscribedMessage {
  string data = 1;
}

// Reed notification
message ReedNotificationMessage {
  string reed_id = 1;
  string user_id = 2;
  string username = 3;
  string content = 4;
  int64 timestamp = 5;
}

// User update notification
message UserUpdateMessage {
  string user_id = 1;
  string update_type = 2;
  int64 timestamp = 3;
}

// Error message
message ErrorMessage {
  string code = 1;
  string message = 2;
  int64 timestamp = 3;
}

// Client request for a reed's content, by id.
message RequestReedMessage {
  string request_id = 1;
  string reed_id = 2;
}

// Server delivery of requested reed content. id (WSMessage-level, not
// modeled here) carries the relay event id; request_id echoes the
// requester's original RequestReedMessage.request_id. reed_id is the
// server's own record of which reed this delivery answers — the client
// checks the decrypted reed's own id against it, since ciphertext could
// otherwise be swapped for a different, independently valid reed.
message DataResponseMessage {
  string request_id = 1;
  string ciphertext = 2;
  string username = 3;
  string reed_id = 4;
}
