syntax = "proto3";

package syrinx;

import "common.proto";

option go_package = "github.com/alvaro/syrinx/proto";

// WebSocket message wrapper. Every frame on the wire — both directions —
// is exactly one WSMessage, binary-encoded.
message WSMessage {
  MessageType type = 1;
  // Event id this message replies to or originates (relay event id for
  // DATA_RESPONSE-family deliveries and mailbox notifications; echoed
  // back by the client on DATA_ACK/DATA_INVALID/RELAY_RESPONSE/MISS/
  // ERROR). Empty for message types that carry no event id.
  string id = 2;
  // Human-readable mirror of type (e.g. "DATA_RESPONSE"), redundant with
  // the enum — lets a raw frame be read without cross-referencing this
  // schema (protobuf enums are wire-encoded as bare varints, not names).
  string type_name = 3;
  oneof payload {
    PingMessage ping = 4;
    PongMessage pong = 5;
    SubscribeMessage subscribe = 6;
    ReedNotificationMessage reed_notification = 7;
    UserUpdateMessage user_update = 8;
    ErrorMessage error = 9;
    RequestReedMessage request_reed = 10;
    DataResponseMessage data_response = 11;

    ShutdownMessage shutdown = 12;
    SyncRequestMessage sync_request = 13;
    RelayResponseMessage relay_response = 14;
    RelayRequestMessage relay_request = 15;
    RequestAckMessage request_ack = 16;
    MailboxMessage mailbox = 17;
    MailboxAckMessage mailbox_ack = 18;
    KeyFetchErrorMessage key_fetch_error = 19;
    RevokedKeyUsedMessage revoked_key_used = 20;
    ContentRejectedMessage content_rejected = 21;
    SubscribeProfileMessage subscribe_profile = 22;
    UnsubscribeProfileMessage unsubscribe_profile = 23;
    SubscribeReedMessage subscribe_reed = 24;
    UnsubscribeReedMessage unsubscribe_reed = 25;
    SubscribePipeMessage subscribe_pipe = 26;
    UnsubscribePipeMessage unsubscribe_pipe = 27;
    PublishReadyMessage publish_ready = 28;
    PublishReadyAckMessage publish_ready_ack = 29;
    ReedNotFoundMessage reed_not_found = 30;
    ReedNotHeldMessage reed_not_held = 31;
    InvalidRequestIdErrorMessage invalid_request_id_error = 32;
    ReedStatsMessage reed_stats = 33;
    ReedCoverageMessage reed_coverage = 34;
    ReedEchoesMessage reed_echoes = 35;
    ReedRepliesMessage reed_replies = 36;
    ReedLikesMessage reed_likes = 37;
    RipplePostedMessage ripple_posted = 38;
    RippleUpdatedMessage ripple_updated = 39;
    ReedRemovedMessage reed_removed = 40;
    AccountRemovedMessage account_removed = 41;
    ProfilePageMessage profile_page = 42;
    PageAckMessage page_ack = 43;
    EvictionMessage eviction = 44;
    EvictionAckMessage eviction_ack = 45;
    NewVouchMessage new_vouch = 46;
    PeerServerLostMessage peer_server_lost = 47;
    NewRippleMessage new_ripple = 48;
    KeyRevokedMessage key_revoked = 49;
    RequestThreadMessage request_thread = 50;
    RelayThreadMessage relay_thread = 51;
    ThreadRemovedMessage thread_removed = 52;
    KeyEvictionMessage key_eviction = 53;
    KeyEvictionAckMessage key_eviction_ack = 54;
    UserBlockedMessage user_blocked = 55;
    UserBlockedAckMessage user_blocked_ack = 56;
    UserUnblockedMessage user_unblocked = 57;
    UserUnblockedAckMessage user_unblocked_ack = 58;
  }
}

// Message types.
enum MessageType {
  UNKNOWN = 0;
  PING = 1;
  PONG = 2;
  SUBSCRIBE = 3;
  REED_NOTIFICATION = 4;
  USER_UPDATE = 5;
  ERROR = 6;
  SUBSCRIBE_USER = 7;
  SUBSCRIBE_BROADCAST = 8;
  UNSUBSCRIBE_USER = 9;
  UNSUBSCRIBE_BROADCAST = 10;
  REQUEST_REED = 11;
  DATA_RESPONSE = 12;

  SIGTERM = 13;
  SYNC_REQUEST = 14;
  RELAY_RESPONSE = 15;
  RELAY_MISS = 16;
  RELAY_ERROR = 17;
  RELAY_REQUEST = 18;
  DATA_ACK = 19;
  DATA_INVALID = 20;
  REQUEST_ACK = 21;
  MAILBOX = 22;
  MAILBOX_ACK = 23;
  KEY_FETCH_ERROR = 24;
  REVOKED_KEY_USED = 25;
  CONTENT_REJECTED = 26;
  SUBSCRIBE_PROFILE = 27;
  UNSUBSCRIBE_PROFILE = 28;
  SUBSCRIBE_REED = 29;
  UNSUBSCRIBE_REED = 30;
  SUBSCRIBE_PIPE = 31;
  UNSUBSCRIBE_PIPE = 32;
  PUBLISH_READY = 33;
  PUBLISH_READY_ACK = 34;
  REED_NOT_FOUND = 35;
  REED_NOT_HELD = 36;
  INVALID_REQUEST_ID_ERROR = 37;
  REED_STATS = 38;
  REED_COVERAGE = 39;
  REED_ECHOES = 40;
  REED_REPLIES = 41;
  REED_LIKES = 42;
  RIPPLE_POSTED = 43;
  RIPPLE_UPDATED = 44;
  REED_REMOVED = 45;
  ACCOUNT_REMOVED = 46;
  BROADCAST_REED = 47;
  PIPE_REED = 48;
  FOLLOW_REED = 49;
  ARCHIVE_REED = 50;
  REED_REPLY = 51;
  MENTION = 52;
  PROFILE_PAGE = 53;
  PAGE_ACK = 54;
  EVICTION = 55;
  EVICTION_ACK = 56;
  NEW_VOUCH = 57;
  PEER_SERVER_LOST = 58;
  NEW_RIPPLE = 59;
  KEY_REVOKED = 60;
  REQUEST_THREAD = 61;
  RELAY_THREAD = 62;
  THREAD_REMOVED = 63;
  KEY_EVICTION = 64;
  KEY_EVICTION_ACK = 65;
  USER_BLOCKED = 66;
  USER_BLOCKED_ACK = 67;
  USER_UNBLOCKED = 68;
  USER_UNBLOCKED_ACK = 69;
}

// Ping message
message PingMessage {
  string data = 1;
}

// Pong message
message PongMessage {
  string data = 1;
}

// Subscribe message
message SubscribeMessage {
  string data = 1;
}

// Reed notification
message ReedNotificationMessage {
  string reed_id = 1;
  string user_id = 2;
  string username = 3;
  string content = 4;
  uint32 timestamp = 5;
}

// User update notification
message UserUpdateMessage {
  string user_id = 1;
  string update_type = 2;
  uint32 timestamp = 3;
}

// Error message
message ErrorMessage {
  string code = 1;
  string message = 2;
  uint32 timestamp = 3;
}

// Client request for a reed's content, by id.
message RequestReedMessage {
  string request_id = 1;
  string reed_id = 2;
}

// Server delivery of requested reed content. id (WSMessage-level, not
// modeled here) carries the relay event id; request_id echoes the
// requester's original RequestReedMessage.request_id. reed_id is the
// server's own record of which reed this delivery answers — the client
// checks the decrypted reed's own id against it, since ciphertext could
// otherwise be swapped for a different, independently valid reed.
message DataResponseMessage {
  string request_id = 1;
  string ciphertext = 2;
  string username = 3;
  string reed_id = 4;
}

// Server notice that it is shutting down; the client should reconnect.
message ShutdownMessage {
}

// Client request to replay any events it missed while disconnected.
message SyncRequestMessage {
  string request_id = 1;
}

// Holder's answer to a RelayRequestMessage: the requested ciphertext.
message RelayResponseMessage {
  string ciphertext = 1;
}

// Server ask to a holder to relay a reed's ciphertext to a requester.
message RelayRequestMessage {
  string reed_id = 1;
  // The requester's key, which the holder must encrypt to; its owner is the
  // requester. Set by the requester's home server, never picked by the holder.
  string requester_key_id = 2;
}

// Client ask for a whole thread, by its head's ID.
message RequestThreadMessage {
  string request_id = 1;
  string thread_id = 2;
}

// Server ask to a holder to relay a whole thread as one bundle, encrypted
// to requester_key_id like RELAY_REQUEST.
message RelayThreadMessage {
  string thread_id = 1;
  string requester_key_id = 2;
}

// Server ack of a client's REQUEST_REED, naming which reed/request it matched.
message RequestAckMessage {
  string request_id = 1;
  string reed_id = 2;
}

// Mailbox delivery: a message queued for a user while they were offline.
message MailboxMessage {
  string id = 1;
  string ciphertext = 2;
}

// Client ack of a mailbox delivery, by its id.
message MailboxAckMessage {
  string id = 1;
}

// Client report that it failed to fetch a key needed to verify content
// received over this connection.
message KeyFetchErrorMessage {
  string user_id = 1;
  string key_id = 2;
}

// Client report that content used a key at or after its revocation.
message RevokedKeyUsedMessage {
  string user_id = 1;
  string key_id = 2;
}

// Client report of content it refused to store or trust. reason is one
// of a small standardized set (docs/content_privacy.md), or empty.
message ContentRejectedMessage {
  string store_name = 1;
  string reason = 2;
}

message SubscribeProfileMessage {
  string user_id = 1;
}

message UnsubscribeProfileMessage {
  string user_id = 1;
}

// Request for one page of an author's reed history, 1-based.
message ProfilePageMessage {
  string user_id = 1;
  uint32 page = 2;
}

// count and has_more describe the author's reeds at this page offset,
// before subtracting what the viewer already holds — so they are the
// same for every viewer. count is 0 for a page past the end.
message PageAckMessage {
  string user_id = 1;
  uint32 page = 2;
  uint32 count = 3;
  bool has_more = 4;
}

message SubscribeReedMessage {
  string reed_id = 1;
}

message UnsubscribeReedMessage {
  string reed_id = 1;
}

message SubscribePipeMessage {
  string tag = 1;
}

message UnsubscribePipeMessage {
  string tag = 1;
}

// Client notice that a reed is ready to publish/broadcast.
message PublishReadyMessage {
  string reed_id = 1;
  // Whether to include this reed in the broadcast fanout. Absent (see
  // has_broadcast) means "true" — opting out requires an explicit false.
  bool broadcast = 2;
  bool has_broadcast = 3;
}

message PublishReadyAckMessage {
  string reed_id = 1;
}

// Client notice that it no longer holds this reed's content, so the
// server can drop its allocation before the client deletes it locally.
message EvictionMessage {
  string reed_id = 1;
}

// Acks an EVICTION. Idempotent: sent whether or not an allocation row
// existed, so a client that retries never blocks on a lost ack.
message EvictionAckMessage {
  string reed_id = 1;
}

// Client notice that it no longer holds this public key, so the server
// stops owing it the key's revocation.
message KeyEvictionMessage {
  string key_id = 1;
}

// Acks a KEY_EVICTION. Idempotent, like EvictionAckMessage.
message KeyEvictionAckMessage {
  string key_id = 1;
}

message ReedNotFoundMessage {
  string request_id = 1;
  string reed_id = 2;
}

// Distinct from ReedNotFoundMessage: the reed exists but this server
// doesn't hold its ciphertext.
message ReedNotHeldMessage {
  string request_id = 1;
  string reed_id = 2;
}

// Server rejection of a request_id that doesn't embed the identity of
// the connection that sent it.
message InvalidRequestIdErrorMessage {
  string request_id = 1;
}

message ReedStatsMessage {
  string reed_id = 1;
  int32 echoes = 2;
  int32 coverage_percent = 3;
  int32 replies = 4;
  int32 likes = 5;
}

message ReedCoverageMessage {
  string reed_id = 1;
  int32 coverage_percent = 2;
}

message ReedEchoesMessage {
  string reed_id = 1;
  int32 echoes = 2;
}

message ReedRepliesMessage {
  string reed_id = 1;
  int32 replies = 2;
}

message ReedLikesMessage {
  string reed_id = 1;
  int32 likes = 2;
}

message RipplePostedMessage {
  // The reed's author.
  string user_id = 1;
  string reed_id = 2;
  Ripple ripple = 3;
}

// A soft-delete patch: content becomes "[DELETED]" on the referenced
// ripple. There is no separate RIPPLE_DELETED type — the client applies
// this same shape in place over the existing row.
message RippleUpdatedMessage {
  string user_id = 1;
  string reed_id = 2;
  Ripple ripple = 3;
}

message ReedRemovedMessage {
  string request_id = 1;
  ReedRemovalCert cert = 2;
}

// Pushed to users holding content signed by a revoked key; they drop what
// it signed at or after the revocation and answer DATA_ACK.
message KeyRevokedMessage {
  string request_id = 1;
  KeyRevocationCert revocation = 2;
}

// Pushed to users who hold or follow any part of a removed thread; they
// drop every part the record lists and answer DATA_ACK.
message ThreadRemovedMessage {
  string request_id = 1;
  ThreadRemovalCert cert = 2;
  ThreadRecord record = 3;
}

// Tells a blocked user they were blocked. With request_id it answers a
// request the block refused; without one it is the push, acked with
// USER_BLOCKED_ACK.
message UserBlockedMessage {
  string request_id = 1;
  BlockCert block = 2;
}

message UserBlockedAckMessage {
  string user_id = 1;
}

// Tells a blocked user a block was lifted, acked with USER_UNBLOCKED_ACK.
message UserUnblockedMessage {
  string user_id = 1;
}

message UserUnblockedAckMessage {
  string user_id = 1;
}

message AccountRemovedMessage {
  string request_id = 1;
  AccountRemovalCert cert = 2;
}

// Tells an online subject that someone vouched for one of their keys. It
// carries only the vouch id: the client fetches and verifies the cert
// itself, since a pushed payload is the server's word.
message NewVouchMessage {
  string vouch_id = 1;
}

// Tells a reed author someone rippled on one of their reeds. Carries
// nothing: the client fetches its ripples inbox when the user opens it.
message NewRippleMessage {
}

// Tells a viewer this server lost its link to a peer: live updates from
// that peer's profiles and reeds have stopped until the viewer subscribes
// again once the peer is back.
message PeerServerLostMessage {
  string server_id = 1;
  string server_name = 2;
}
