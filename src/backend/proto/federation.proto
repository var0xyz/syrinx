syntax = "proto3";

package syrinx;

import "common.proto";
import "identity.proto";
import "websocket.proto";

option go_package = "github.com/alvaro/syrinx/proto";

// POST /federation/invitations.
message FederationCreateRequest {
  string name = 1;
  string remote_public_key_armor = 2;
}

message FederationCreateResponse {
  string invite_id = 1;
  string connection_string = 2;
  string status = 3;
}

message FederationInvitation {
  string invite_id = 1;
  string name = 2;
  string status = 3;
  string created_by = 4;
  string remote_fingerprint = 5;
  int64 created_at = 6;
  int64 accepted_at = 7;
  optional string server_id = 8;
  optional string reviewed_by = 9;
  int64 reviewed_at = 10;
  optional string connection_string = 11;
}

message FederationInvitationList {
  repeated FederationInvitation invitations = 1;
}

// GET /federation/servers/{id}/invitation: unset when this server was the
// responder.
message FederationInvitationResponse {
  FederationInvitation invitation = 1;
}

// An approved peer.
message FederationServer {
  string server_id = 1;
  string name = 2;
  string base_url = 3;
  string frontend_url = 4;
  bool connected = 5;
  // Approved on both sides; connected alone means only on ours.
  bool established = 6;
  int64 created_at = 7;
  bool revoked = 8;
  int64 revoked_at = 9;
  optional string revoked_by = 10;
  optional string revoked_reason = 11;
  // A disconnect was requested but not yet confirmed by a second admin.
  bool disconnect_pending = 12;
  int64 disconnect_requested_at = 13;
  optional string disconnect_requested_by = 14;
  optional string disconnect_reason = 15;
}

message FederationServerList {
  repeated FederationServer servers = 1;
}

// A handshake attempt against a peer, at any stage.
message FederationAttempt {
  string attempt_id = 1;
  string remote_server_id = 2;
  string remote_server_name = 3;
  string base_url = 4;
  string frontend_url = 5;
  string fingerprint = 6;
  optional string invitation_id = 7;
  optional string server_id = 8;
  int64 created_at = 9;
  string status = 10;
  optional string approved_by = 11;
  int64 approved_at = 12;
  optional string rejected_by = 13;
  int64 rejected_at = 14;
  optional string rejected_reason = 15;
}

// GET /federation/servers/{id}/attempt: unset if no attempt row exists.
message FederationAttemptResponse {
  FederationAttempt attempt = 1;
}

// GET /federation/list: the mesh tab's combined view.
message FederationList {
  repeated FederationInvitation invitations = 1;
  repeated FederationAttempt attempts = 2;
  repeated FederationServer servers = 3;
}

// GET /federation/servers/{id}/logs and /federation/attempts/{id}/logs:
// one log line per line, displayed verbatim.
message FederationLogs {
  string text = 1;
}

// POST /federation/attempt: the connection string pasted by an admin.
message FederationAttemptRequest {
  string connection_string = 1;
}

message FederationAttemptStatus {
  string status = 1;
  string server_id = 2;
}

// POST /federation/attempts/{id}/reject and /federation/servers/{id}/revoke.
message FederationReasonRequest {
  string reason = 1;
}

// The outcome of an admin action on an invitation, attempt or server.
message FederationActionResponse {
  string invite_id = 1;
  string attempt_id = 2;
  string server_id = 3;
  string status = 4;
  // Approval only: the other server had already approved us.
  bool established = 5;
}

// POST /federation/connect/{inviteId}: the responder calls the initiator
// back; the secret and signature prove it redeemed the invitation.
message FederationConnectRequest {
  string server_id = 1;
  string server_name = 2;
  string base_url = 3;
  string frontend_url = 4;
  string fingerprint = 5;
  string signature = 6;
  string secret = 7;
}

message FederationConnectResponse {
  string status = 1;
  string server_id = 2;
}

// GET /federation/users/{userID}/identity: the snapshot a peer resolves a
// local user through.
message FederationUserIdentity {
  User user = 1;
  string active_key_id = 2;
}

// Relay calls between peers, under /federation/relay/. Each call has its
// own request message, and its own response where it answers with a body.

message RelayRequestPayload {
  string reed_id = 1;
  string author_id = 2;
  string requester_user_id = 3;
  string requester_key_id = 4;
  string peer_request_id = 5;
  // Asks for the whole thread reed_id heads.
  bool thread = 6;
}

message RelayRequestResponse {
  string peer_event_id = 1;
  string status = 2;
}

message RelayProfilePagePayload {
  string author_id = 1;
  string requester_user_id = 2;
  int32 page = 3;
}

message RelayProfilePageResponse {
  repeated string reed_ids = 1;
  int32 count = 2;
  bool has_more = 3;
}

// Relayed content for a request the receiver registered. A relayed thread
// also carries its record, which the receiver verifies.
message RelayDeliverPayload {
  string peer_event_id = 1;
  string ciphertext = 2;
  ThreadRecord record = 3;
}

message RelayNotHeldPayload {
  string peer_event_id = 1;
}

message RelayCancelPayload {
  string peer_event_id = 1;
}

message RelayAckPayload {
  string peer_event_id = 1;
}

message RelaySubscribeReedPayload {
  string reed_id = 1;
  string requester_user_id = 2;
}

message RelaySubscribeReedResponse {
  bool found = 1;
  int32 echoes = 2;
  int32 coverage_percent = 3;
  int32 replies = 4;
  int32 likes = 5;
}

message RelayUnsubscribeReedPayload {
  string reed_id = 1;
  string requester_user_id = 2;
}

// One live update for a reed, as the WS message its local viewers get.
message RelayReedStatsPayload {
  string reed_id = 1;
  string exclude_user_id = 2;
  WSMessage message = 3;
}

message RelayHolderNotifyPayload {
  string reed_id = 1;
}

message RelayFallbackRequestPayload {
  string reed_id = 1;
  string requester_user_id = 2;
  string requester_key_id = 3;
  string peer_request_id = 4;
}

message RelayFallbackRequestResponse {
  string peer_event_id = 1;
  string status = 2;
}

message RelaySearchUsersPayload {
  string query = 1;
  int32 limit = 2;
}

message RelaySearchUsersResponse {
  repeated UserSearchResult users = 1;
}

message RelayDisconnectNotifyPayload {
  string reason = 1;
}

message RelayNewReedReply {
  string parent_reed_id = 1;
  string root_id = 2;
}

message RelayNewReedEcho {
  string echoed_reed_id = 1;
  bool is_blank = 2;
}

// Announces one of the sender's own reeds, without content.
message RelayNewReedPayload {
  string reed_id = 1;
  string author_id = 2;
  int64 signed_at = 3;
  repeated string mentions = 4;
  RelayNewReedReply reply = 5;
  RelayNewReedEcho echo = 6;
}

// A signed reed removal as it travels between servers.
message RelayReedRemovalCert {
  string reed_id = 1;
  string user_id = 2;
  string user_signature = 3;
  string user_key_id = 4;
  string server_signature = 5;
  string server_fingerprint = 6;
  int64 server_signed_at = 7;
}

// The removal cert, plus the parent the removed reed replied to.
message RelayReedRemovalPayload {
  RelayReedRemovalCert cert = 1;
  string parent_reed_id = 2;
}

message RelayRealtimeResetPayload {
  string reason = 1;
}

message RelayAccountRemovalNotifyPayload {
  string user_id = 1;
  string note = 2;
  string user_signature = 3;
  string user_key_id = 4;
  string server_signature = 5;
  string server_fingerprint = 6;
  int64 server_signed_at = 7;
}

message RelayUnblockPayload {
  string user_id = 1;
  string blocked_user_id = 2;
}

message RelayVouchReferencePayload {
  Vouch cert = 1;
}

message RelayVouchWithdrawalPayload {
  string vouch_id = 1;
  string voucher_user_id = 2;
  VouchWithdrawal withdrawal = 3;
}
