syntax = "proto3";

package syrinx;

import "common.proto";

option go_package = "github.com/var0xyz/syrinx/proto";

// One page of admin requests, newest first.
message AdminRequestList {
  repeated AdminRequest requests = 1;
  string next_cursor = 2;
}

// A page of the ledger in chain order. head, the entry with no previous
// one, is set only on the first page.
message LedgerPage {
  optional LedgerEntry head = 1;
  repeated LedgerEntry tail = 2;
}

// One user in an invite tree. invited_by is empty on the inviter at the
// top; depth is 0 for that inviter, 1 for the user the tree is about.
message InviteTreeNode {
  string user_id = 1 [json_name = "userID"];
  string username = 2;
  string role = 3;
  uint32 depth = 4;
  string invited_by = 5 [json_name = "invitedBy"];
  bool suspended = 6;
  bool removed = 7;
}

// A user's inviter, the user, and everyone below them, in thread order.
message InviteTree {
  repeated InviteTreeNode nodes = 1;
}

// The usernames root has reserved, lowercased.
message ReservedUsernameList {
  repeated string usernames = 1;
}

// A member's signed flag on a reed. POST /api/flags and the peer relay
// both carry it.
message ReedFlag {
  string reed_id = 1 [json_name = "reedID"];
  string reporter_id = 2 [json_name = "reporterID"];
  string note = 3;
  uint32 created_at = 4;
  UserSignature signature = 5;
}

// A reed with open flags, for admins.
message FlaggedReed {
  string reed_id = 1 [json_name = "reedID"];
  string author_id = 2 [json_name = "authorID"];
  repeated ReedFlag flags = 3;
}

message FlaggedReedList {
  repeated FlaggedReed reeds = 1;
  string next_cursor = 2;
}

// A user's role and the admin permissions they hold, sorted.
message UserPermissions {
  string role = 1;
  repeated string permissions = 2;
}
