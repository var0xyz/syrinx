syntax = "proto3";

package syrinx;

import "common.proto";

option go_package = "github.com/var0xyz/syrinx/proto";

// One page of admin requests, newest first.
message AdminRequestList {
  repeated AdminRequest requests = 1;
  string next_cursor = 2;
}

// A page of the ledger in chain order. head, the entry with no previous
// one, is set only on the first page.
message LedgerPage {
  optional LedgerEntry head = 1;
  repeated LedgerEntry tail = 2;
}

// One user in an invite tree. invited_by is empty on the inviter at the
// top; depth is 0 for that inviter, 1 for the user the tree is about.
message InviteTreeNode {
  string user_id = 1 [json_name = "userID"];
  string username = 2;
  string role = 3;
  uint32 depth = 4;
  string invited_by = 5 [json_name = "invitedBy"];
  bool suspended = 6;
  bool removed = 7;
}

// A user's inviter, the user, and everyone below them, in thread order.
message InviteTree {
  repeated InviteTreeNode nodes = 1;
}

// A member's signed flag on a reed. POST /api/flags and the peer relay
// both carry it, and answer with it countersigned by the reed's server.
message ReedFlag {
  string reed_id = 1 [json_name = "reedID"];
  string reporter_id = 2 [json_name = "reporterID"];
  string note = 3;
  UserSignature signature = 4;
  ServerSignature server_signature = 5;
  FlagWithdrawal withdrawal = 6;
  // The case the reed's server put it in, named in its countersignature.
  string case_id = 7 [json_name = "caseID"];
  // Admins' copies only, once the case is dismissed. Never sent to the
  // reporter.
  FlagDismissal dismissal = 8;
}

// The reporter taking back their flag, signed over the flag's signature
// and countersigned by the reed's server, whose time is the withdrawal's.
// POST /flags/{reedID}/withdraw sends only the signature.
message FlagWithdrawal {
  UserSignature signature = 1;
  ServerSignature server_signature = 2;
}

// An admin closing a case, signed over it by them and countersigned by
// this server, whose time is the dismissal's.
message FlagDismissal {
  string case_id = 1 [json_name = "caseID"];
  string reed_id = 2 [json_name = "reedID"];
  string dismissed_by = 3;
  string reason = 4;
  UserSignature signature = 5;
  ServerSignature server_signature = 6;
}

// A reed's flags from the first open one until a dismissal closes them or
// all are withdrawn (void), for admins. Flags newest first.
message FlagCase {
  string id = 1;
  string reed_id = 2 [json_name = "reedID"];
  string author_id = 3 [json_name = "authorID"];
  uint32 opened_at = 4;
  repeated ReedFlag flags = 5;
  FlagDismissal dismissal = 6;
  uint32 voided_at = 7;
}

// POST /admin/flags/cases/{caseID}/dismiss: the admin's signed dismissal.
message DismissCaseRequest {
  string reason = 1;
  UserSignature signature = 2;
}

message FlagCaseList {
  repeated FlagCase cases = 1;
  string next_cursor = 2;
}

// A user's role and the admin permissions they hold, sorted.
message UserPermissions {
  string role = 1;
  repeated string permissions = 2;
}
