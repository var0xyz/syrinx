<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Syrinx</title>

		<!-- PWA Meta Tags -->
		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="#0b0f14" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Syrinx" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="application-name" content="Syrinx" />

		<!-- Icons for different platforms -->
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

		<!-- Splash screens for iOS -->
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

		<!-- Prevent zoom on iOS -->
		<meta name="format-detection" content="telephone=no" />

		<!-- https://github.com/emn178/js-md5/blob/4c40b9472526dbffff49e42da7aeda79778ac88a/build/md5.min.js -->
		<script src="/md5.min.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-sveltekit-reload>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
