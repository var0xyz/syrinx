root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -C src/backend -o ../../tmp/syrinx ."
  bin = "tmp/syrinx"
  full_bin = "sh -c 'cd src/backend && ../../tmp/syrinx'"
  include_ext = ["go"]
  exclude_dir = ["tmp", "src/frontend", "keys", "src/backend/proto"]
  delay = 1000
  kill_delay = "0s"
  rerun = true

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
